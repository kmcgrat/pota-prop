name: Multi-Platform Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.artifact_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: pota-hunter-linux-x86_64
          - os: windows-latest
            artifact_name: pota-hunter-windows-x64
          - os: macos-latest
            artifact_name: pota-hunter-macos-apple-silicon
          - os: macos-15-intel
            artifact_name: pota-hunter-macos-intel

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Linux Dependencies
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt update
          sudo apt install -y libxcb-cursor0 libgl1-mesa-glx

      - name: Install Python requirements
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # --- Linux Build ---
      - name: Build Linux AppImage
        if: runner.os == 'Linux'
        run: |
          pyinstaller --noconfirm --onedir --windowed --name "pota-hunter" main.py
          mkdir -p AppDir/usr/bin
          cp -r dist/pota-hunter/* AppDir/usr/bin/

          cat <<EOF > AppDir/pota-hunter.desktop
          [Desktop Entry]
          Name=POTA Hunter
          Exec=pota-hunter
          Icon=pota-hunter
          Type=Application
          Categories=Utility;
          EOF

          touch AppDir/pota-hunter.png

          cat <<'EOF' > AppDir/AppRun
          #!/bin/bash
          HERE="$(dirname "$(readlink -f "${0}")")"
          export PATH="${HERE}/usr/bin:${PATH}"
          export LD_LIBRARY_PATH="${HERE}/usr/bin:${LD_LIBRARY_PATH}"
          export QT_QPA_PLATFORM=xcb
          exec "${HERE}/usr/bin/pota-hunter" "$@"
          EOF
          chmod +x AppDir/AppRun

          wget https://github.com/AppImage/AppImageKit/releases/download/13/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          ./appimagetool-x86_64.AppImage AppDir POTA_Hunter-x86_64.AppImage

      # --- Windows Build ---
      - name: Build Windows Executable
        if: runner.os == 'Windows'
        run: |
          pyinstaller --noconfirm --onefile --windowed --name "pota-hunter" main.py

      # --- macOS Build ---
      - name: Build macOS App Bundle
        if: runner.os == 'macOS'
        run: |
          pyinstaller --noconfirm --onedir --windowed --name "pota-hunter" main.py
          cd dist
          zip -r pota-hunter-mac.zip pota-hunter.app

      # --- Artifact Uploads ---
      - name: Upload Linux Artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: POTA_Hunter-x86_64.AppImage

      - name: Upload Windows Artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/pota-hunter.exe

      - name: Upload macOS Artifact
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/pota-hunter-mac.zip
name: Multi-Platform Build

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.artifact_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            artifact_name: pota-prop-linux-x86_64
          - os: windows-latest
            artifact_name: pota-prop-windows-x64

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Linux Dependencies
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt update
          sudo apt install -y libxcb-cursor0 libgl1 libglx-mesa0 upx-ucl

      # Windows Dependencies
      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install upx

      # Python Requirements
      - name: Install Python requirements
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pillow
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # --- Linux Build ---
      - name: Build Linux AppImage
        if: runner.os == 'Linux'
        shell: bash
        run: |
          EXCLUDES="--exclude-module PyQt6.QtQml --exclude-module PyQt6.QtQuick --exclude-module PyQt6.QtSql --exclude-module PyQt6.QtSensors --exclude-module PyQt6.QtMultimedia --exclude-module PyQt6.QtBluetooth --exclude-module PyQt6.QtNfc --exclude-module PyQt6.QtWebSockets --exclude-module PyQt6.QtPositioning --exclude-module PyQt6.QtTest --exclude-module PyQt6.QtDesigner --exclude-module PyQt6.QtHelp --exclude-module PyQt6.QtLocation --exclude-module PyQt6.QtPrintSupport --exclude-module PyQt6.QtQuickWidgets --exclude-module PyQt6.QtRemoteObjects --exclude-module PyQt6.QtSerialPort --exclude-module PyQt6.QtSvg --exclude-module PyQt6.QtSvgWidgets --exclude-module PyQt6.QtTextToSpeech --exclude-module PyQt6.QtXml --exclude-module tkinter --exclude-module unittest --exclude-module pdb --exclude-module pydoc"
          pyinstaller --noconfirm --onedir --windowed --name "pota-prop" --upx-dir=/usr/bin $EXCLUDES --add-data "pota_prop.png:." --add-data "map.html:." main.py
          mkdir -p AppDir/usr/bin
          cp -r dist/pota-prop/* AppDir/usr/bin/

          # Remove graphics/system libraries that conflict with host proprietary drivers (NVIDIA/AMD) to fix GLX crashes
          find AppDir/usr/bin -name "libGL*" -delete
          find AppDir/usr/bin -name "libEGL*" -delete
          find AppDir/usr/bin -name "libGLES*" -delete
          find AppDir/usr/bin -name "libglx*" -delete
          find AppDir/usr/bin -name "libdrm*" -delete
          find AppDir/usr/bin -name "libgbm*" -delete
          find AppDir/usr/bin -name "libstdc++*" -delete
          find AppDir/usr/bin -name "libgcc_s*" -delete

          printf "[Desktop Entry]\nName=POTA Prop\nExec=pota-prop\nIcon=pota-prop\nType=Application\nCategories=Utility;\n" > AppDir/pota-prop.desktop
          cp pota_prop.png AppDir/pota-prop.png

          printf '#!/bin/bash\nHERE="$(dirname "$(readlink -f "${0}")")"\nexport PATH="${HERE}/usr/bin:${PATH}"\nexport LD_LIBRARY_PATH="${HERE}/usr/bin:${LD_LIBRARY_PATH}"\nexport QT_QPA_PLATFORM=xcb\nexec "${HERE}/usr/bin/pota-prop" "$@"\n' > AppDir/AppRun
          chmod +x AppDir/AppRun

          wget -O appimagetool-x86_64.AppImage https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          APPIMAGE_EXTRACT_AND_RUN=1 ./appimagetool-x86_64.AppImage AppDir POTA_Hunter-x86_64.AppImage

      # --- Windows Build ---
      - name: Build Windows Executable
        if: runner.os == 'Windows'
        shell: bash
        run: |
          python -c "from PIL import Image; Image.open('pota_prop.png').save('pota_prop.ico')"
          EXCLUDES="--exclude-module PyQt6.QtQml --exclude-module PyQt6.QtQuick --exclude-module PyQt6.QtSql --exclude-module PyQt6.QtSensors --exclude-module PyQt6.QtMultimedia --exclude-module PyQt6.QtBluetooth --exclude-module PyQt6.QtNfc --exclude-module PyQt6.QtWebSockets --exclude-module PyQt6.QtPositioning --exclude-module PyQt6.QtTest --exclude-module PyQt6.QtDesigner --exclude-module PyQt6.QtHelp --exclude-module PyQt6.QtLocation --exclude-module PyQt6.QtPrintSupport --exclude-module PyQt6.QtQuickWidgets --exclude-module PyQt6.QtRemoteObjects --exclude-module PyQt6.QtSerialPort --exclude-module PyQt6.QtSvg --exclude-module PyQt6.QtSvgWidgets --exclude-module PyQt6.QtTextToSpeech --exclude-module PyQt6.QtXml --exclude-module tkinter --exclude-module unittest --exclude-module pdb --exclude-module pydoc"
          pyinstaller --noconfirm --onefile --windowed --name "pota-prop" --icon "pota_prop.ico" $EXCLUDES --add-data "pota_prop.png;." --add-data "map.html;." main.py

      # --- Artifact Uploads ---
      # Removed actions/upload-artifact steps to save storage quota. 
      # Binaries are now published directly to GitHub Releases below.

      # --- GitHub Release ---
      - name: Publish Linux Release
        if: startsWith(github.ref, 'refs/tags/v') && runner.os == 'Linux'
        uses: softprops/action-gh-release@v2
        with:
          files: POTA_Hunter-x86_64.AppImage

      - name: Publish Windows Release
        if: startsWith(github.ref, 'refs/tags/v') && runner.os == 'Windows'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/pota-prop.exe

name: Multi-Platform Build

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.artifact_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: pota-prop-linux-x86_64
          - os: windows-latest
            artifact_name: pota-prop-windows-x64

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Linux Dependencies
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt update
          sudo apt install -y libxcb-cursor0 libgl1 libglx-mesa0

      # Python Requirements
      - name: Install Python requirements
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pillow
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # --- Linux Build ---
      - name: Build Linux AppImage
        if: runner.os == 'Linux'
        shell: bash
        run: |
          pyinstaller --noconfirm --onedir --windowed --name "pota-prop" --add-data "pota_prop.png:." main.py
          mkdir -p AppDir/usr/bin
          cp -r dist/pota-prop/* AppDir/usr/bin/

          printf "[Desktop Entry]\nName=POTA Prop\nExec=pota-prop\nIcon=pota-prop\nType=Application\nCategories=Utility;\n" > AppDir/pota-prop.desktop
          touch AppDir/pota-prop.png

          printf '#!/bin/bash\nHERE="$(dirname "$(readlink -f "${0}")")"\nexport PATH="${HERE}/usr/bin:${PATH}"\nexport LD_LIBRARY_PATH="${HERE}/usr/bin:${LD_LIBRARY_PATH}"\nexport QT_QPA_PLATFORM=xcb\nexec "${HERE}/usr/bin/pota-prop" "$@"\n' > AppDir/AppRun
          chmod +x AppDir/AppRun

          wget -O appimagetool-x86_64.AppImage https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          APPIMAGE_EXTRACT_AND_RUN=1 ./appimagetool-x86_64.AppImage AppDir POTA_Hunter-x86_64.AppImage

      # --- Windows Build ---
      - name: Build Windows Executable
        if: runner.os == 'Windows'
        shell: bash
        run: |
          pyinstaller --noconfirm --onefile --windowed --name "pota-prop" --icon "pota_prop.png" --add-data "pota_prop.png;." main.py

      # --- Artifact Uploads ---
      # Removed actions/upload-artifact steps to save storage quota. 
      # Binaries are now published directly to GitHub Releases below.

      # --- GitHub Release ---
      - name: Publish Linux Release
        if: startsWith(github.ref, 'refs/tags/v') && runner.os == 'Linux'
        uses: softprops/action-gh-release@v2
        with:
          files: POTA_Hunter-x86_64.AppImage

      - name: Publish Windows Release
        if: startsWith(github.ref, 'refs/tags/v') && runner.os == 'Windows'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/pota-prop.exe

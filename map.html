<!DOCTYPE html>
<html>
<head>
    <title>POTA Prop Map</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
    
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #161b22;
        }
        #map {
            height: 100%;
            width: 100%;
        }
        .leaflet-container {
            background-color: #161b22;
        }
        
        /* Custom map markers */
        .spot-marker {
            border-radius: 50%;
            border: 2px solid white;
            box-shadow: 0 0 5px rgba(0,0,0,0.8);
            text-align: center;
            color: white;
            font-weight: bold;
            font-size: 10px;
            line-height: 20px;
        }
        .spot-marker-new {
            border: 2px solid #ffffff !important;
            box-shadow: 0 0 6px rgba(255, 255, 255, 0.7);
        }
        .spot-marker-worked {
            border: 2px solid #da3633 !important;
            box-shadow: 0 0 6px rgba(218, 54, 51, 0.7);
        }
        .score-exceptional { background-color: #2ea043; } /* Green */
        .score-high { background-color: #d29922; } /* Yellow */
        .score-good { background-color: #f78166; } /* Orange */
        .score-poor { background-color: #da3633; } /* Red */
    </style>
</head>
<body>

<div id="map"></div>

<script>
    window.onerror = function(msg, url, lineNo, columnNo, error) {
        var err = document.createElement('div');
        err.style.cssText = 'color:red; background:white; z-index:9999; position:absolute; top:0; left:0; padding:10px; border:2px solid red;';
        err.innerHTML = 'JS Error: ' + msg + '<br>Line: ' + lineNo;
        document.body.appendChild(err);
        return false;
    };
</script>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<!-- QtWebChannel Transport for Native Desktop Integration -->
<script src="qrc:///qtwebchannel/qwebchannel.js"></script>

<script>
    var map;
    var heatLayer;
    var markersLayer = L.layerGroup();
    var currentBand = "20m";
    var currentMode = "SSB";
    var graylineLines = [];
    var backend = null;

    // All spots data
    var spotsData = [];
    var lightLayer;
    var darkLayer;
    
    // Live Doppler Radar
    var rvRadarLayer = null;
    var rvRadarOpacity = 0.65;
    var rvRadarTimer = null;

    var usRadarLayer = null;
    var usRadarOpacity = 0.65;

    // Propagation score lookup for instant O(1) hover readouts
    var heatmapScoreLookup = {};

    // Transparent 1x1 pixel for missing tiles
    var emptyTile = 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=';

    function initMap(lat, lon) {
        if (map) return;
        
        map = L.map('map', {
            center: [lat, lon],
            zoom: 3,
            worldCopyJump: true,
            preferCanvas: true,
            maxZoom: 22
        });


        // OpenStreetMap basemap tiles
        lightLayer = L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; OpenStreetMap contributors &copy; CARTO',
            maxZoom: 22,
            maxNativeZoom: 18,
            errorTileUrl: emptyTile,
            noWrap: false
        });
        
        darkLayer = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; OpenStreetMap contributors &copy; CARTO',
            maxZoom: 22,
            maxNativeZoom: 18,
            errorTileUrl: emptyTile,
            noWrap: false
        });

        // Add light layer by default (dark mode is unchecked by default)
        lightLayer.addTo(map);

        // Dedicated pane for propagation heatmap so opacity slider never dims aurora or vector lines
        map.createPane('heatmapPane');
        map.getPane('heatmapPane').style.zIndex = 350;
        
        // Add home marker
        L.marker([lat, lon], {
            icon: L.divIcon({
                className: 'spot-marker',
                html: '<div style="background-color: #58a6ff; width: 10px; height: 10px; border-radius: 50%; margin: 5px;"></div>',
                iconSize: [24, 24]
            })
        }).bindPopup("<b>Home QTH</b>").addTo(map);

        markersLayer.addTo(map);

        // Fetch initial live Doppler weather radar tiles
        fetchRvRadarTiles();
        rvRadarTimer = setInterval(fetchRvRadarTiles, 600000); // 10 min refresh

        // Initialize US NOAA Radar Layer
        usRadarLayer = L.tileLayer('https://mesonet.agron.iastate.edu/cache/tile.py/1.0.0/nexrad-n0q-900913/{z}/{x}/{y}.png', {
            opacity: usRadarOpacity,
            zIndex: 2,
            tileSize: 256,
            maxZoom: 22,
            errorTileUrl: emptyTile,
            noWrap: false,
            bounds: [[20, -130], [50, -60]],
            attribution: '&copy; <a href="https://mesonet.agron.iastate.edu/" style="color:#8b949e;" target="_blank">IEM / NOAA</a>'
        });

        // Map Control for Band selection & Overlays
        var legend = L.control({position: 'topright'});
        legend.onAdd = function (map) {
            var div = L.DomUtil.create('div', 'info legend');
            div.style.backgroundColor = 'rgba(22, 27, 34, 0.85)';
            div.style.padding = '10px';
            div.style.borderRadius = '6px';
            div.style.color = 'white';
            div.style.fontFamily = 'sans-serif';
            div.style.fontSize = '12px';
            div.style.boxShadow = '0 2px 8px rgba(0,0,0,0.5)';
            
            div.innerHTML = '<div id="controls">' +
                            '<div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">' +
                            '<div style="font-weight: bold; font-size: 13px; color: #58a6ff;">Propagation Controls</div>' +
                            '<div>' +
                            '<button onclick="window.toggleControls()" id="collapse-btn" style="background: transparent; border: none; color: #8b949e; cursor: pointer; font-size: 12px; margin-right: 5px; padding: 2px;" title="Collapse Controls">▼</button>' +
                            '<button onclick="window.toggleFullscreen()" style="background: #30363d; border: 1px solid #8b949e; color: #c9d1d9; border-radius: 4px; padding: 2px 6px; cursor: pointer; font-size: 12px;" title="Toggle Fullscreen">⛶</button>' +
                            '</div>' +
                            '</div>' +
                            '<div id="controls-content">' +
                            '<b>Band</b>' +
                            '<select id="band-select" style="margin-top: 3px; margin-bottom: 8px; width: 100%; background: #0d1117; color: #c9d1d9; border: 1px solid #30363d; border-radius: 4px; padding: 3px;" onchange="window.updateFilters()">' +
                            '<option value="All">All</option>' +
                            '<option value="160m">160m</option>' +
                            '<option value="80m">80m</option>' +
                            '<option value="60m">60m</option>' +
                            '<option value="40m">40m</option>' +
                            '<option value="30m">30m</option>' +
                            '<option value="20m" selected>20m</option>' +
                            '<option value="17m">17m</option>' +
                            '<option value="15m">15m</option>' +
                            '<option value="12m">12m</option>' +
                            '<option value="10m">10m</option>' +
                            '<option value="6m">6m</option>' +
                            '<option value="2m">2m</option>' +
                            '<option value="70cm">70cm</option>' +
                            '<option value="Other">Other</option>' +
                            '</select>' +
                            '<b>Mode</b><br>' +
                            '<select id="mode-select" style="margin-top: 3px; margin-bottom: 8px; width: 100%; background: #0d1117; color: #c9d1d9; border: 1px solid #30363d; border-radius: 4px; padding: 3px;" onchange="window.updateFilters()">' +
                            '<option value="All">All</option>' +
                            '<option value="CW">CW</option>' +
                            '<option value="SSB" selected>SSB</option>' +
                            '<option value="FT8">FT8</option>' +
                            '<option value="DATA">DATA (Other)</option>' +
                            '</select>' +
                            '<div style="margin-top: 6px;"><b>Heatmap Opacity</b></div>' +
                            '<input type="range" id="opacity-slider" min="0" max="1" step="0.1" value="0.8" style="width: 100%;" oninput="window.changeOpacity(this.value)">' +
                            '<div style="margin-top: 8px; border-top: 1px solid #30363d; padding-top: 6px;">' +
                            '<label><input type="checkbox" id="darkmap-check" onchange="window.toggleDarkMode()"> Dark Map Mode</label><br>' +
                            '<label><input type="checkbox" id="grayline-check" onchange="window.toggleGrayline()"> Show Grayline</label><br>' +
                            '<label><input type="checkbox" id="aurora-check" onchange="window.toggleAurora()"> Show Aurora Oval</label><br>' +
                            '<label><input type="checkbox" id="lightning-check" onchange="window.updateLightningVisibility()"> Show Lightning Clusters</label>' +
                            '</div>' +
                            '<div style="margin-top: 8px; border-top: 1px solid #30363d; padding-top: 6px;">' +
                            '<label><input type="checkbox" id="rv-radar-check" onchange="window.toggleRvRadar()"> RainViewer Global Radar</label><br>' +
                            '<input type="range" id="rv-radar-opacity-slider" min="0" max="1" step="0.05" value="0.65" style="width: 100%;" oninput="window.changeRvRadarOpacity(this.value)">' +
                            '<div style="margin-top: 4px;">' +
                            '<label><input type="checkbox" id="us-radar-check" onchange="window.toggleUsRadar()"> US NOAA Radar (Composite)</label><br>' +
                            '<input type="range" id="us-radar-opacity-slider" min="0" max="1" step="0.05" value="0.65" style="width: 100%;" oninput="window.changeUsRadarOpacity(this.value)">' +
                            '</div>' + // closes US radar sub-block
                            '</div>' + // closes Radar block
                            '<div id="hover-score" style="margin-top: 8px; font-weight: bold; color: #58a6ff; text-align: center; height: 16px;">Hover map for score</div>' +
                            '<div style="margin-top: 6px; padding-top: 4px; border-top: 1px solid #30363d; font-size: 11px; display: flex; justify-content: space-around; color: #c9d1d9;">' +
                            '<span><span style="display:inline-block; width:8px; height:8px; border-radius:50%; border:2px solid #ffffff; background-color:#2ea043; vertical-align:middle; margin-right:3px;"></span>New</span>' +
                            '<span><span style="display:inline-block; width:8px; height:8px; border-radius:50%; border:2px solid #da3633; background-color:#2ea043; vertical-align:middle; margin-right:3px;"></span>Worked</span>' +
                            '<span><span style="display:inline-block; width:10px; height:10px; border-radius:50%; border:1px solid #fff; background-color:#2ea043; color:white; font-size:8px; font-weight:bold; line-height:10px; text-align:center; vertical-align:middle; margin-right:3px;">+</span>Local</span>' +
                            '</div>' +
                            '</div>' + // closes controls-content
                            '<div id="last-update" style="margin-top: 8px; padding-top: 6px; padding-bottom: 2px; border-top: 1px solid #30363d; font-size: 11px; color: #8b949e; text-align: center; min-height: 16px; display: block;">Standby...</div>' +
                            '</div>'; // closes controls
            
            L.DomEvent.disableClickPropagation(div);
            L.DomEvent.disableScrollPropagation(div);
            return div;
        };
        legend.addTo(map);

        // Global mouse movement handler for high-performance instant propagation score lookup
        map.on('mousemove', function(e) {
            if (!heatmapScoreLookup) return;
            var rawLat = e.latlng.lat;
            var rawLng = e.latlng.lng;
            
            // Normalize longitude to [-180, 180]
            var normLng = ((rawLng + 180) % 360 + 360) % 360 - 180;
            if (normLng === 180) normLng = -180;
            
            var gridLat = Math.floor(rawLat);
            var gridLon = Math.floor(normLng / 2.0) * 2;
            
            var key = gridLat + ',' + gridLon;
            var score = heatmapScoreLookup[key];
            var el = document.getElementById('hover-score');
            if (el) {
                if (score !== undefined && score !== null) {
                    el.innerHTML = "Propagation Score: " + score + "%";
                } else {
                    el.innerHTML = "Hover map for score";
                }
            }
        });

        map.on('mouseout', function() {
            var el = document.getElementById('hover-score');
            if (el) el.innerHTML = "Hover map for score";
        });

        // Initialize QWebChannel bridge if available
        if (typeof QWebChannel !== 'undefined' && typeof qt !== 'undefined' && qt.webChannelTransport) {
            new QWebChannel(qt.webChannelTransport, function (channel) {
                backend = channel.objects.backend;
                console.log("Connected to Python QWebChannel backend.");
            });
        }
    }

    // --- Live Doppler Weather Radar (RainViewer Open API) ---
    function fetchRvRadarTiles() {
        fetch('https://api.rainviewer.com/public/weather-maps.json')
            .then(function(res) { return res.json(); })
            .then(function(data) {
                if (data && data.radar && data.radar.past && data.radar.past.length > 0) {
                    var latest = data.radar.past[data.radar.past.length - 1];
                    var tileUrl = data.host + latest.path + '/256/{z}/{x}/{y}/2/1_1.png';
                    
                    var newRadar = L.tileLayer(tileUrl, {
                        opacity: rvRadarOpacity,
                        zIndex: 2,
                        tileSize: 256,
                        maxZoom: 22,
                        maxNativeZoom: 8,
                        errorTileUrl: emptyTile,
                        noWrap: false,
                        attribution: '&copy; <a href="https://www.rainviewer.com/" style="color:#8b949e;" target="_blank">RainViewer</a>'
                    });
                    
                    var shouldShow = (!document.getElementById('rv-radar-check') || document.getElementById('rv-radar-check').checked);
                    if (shouldShow && map) {
                        if (rvRadarLayer && map.hasLayer(rvRadarLayer)) {
                            map.removeLayer(rvRadarLayer);
                        }
                        rvRadarLayer = newRadar;
                        rvRadarLayer.addTo(map);
                    } else {
                        if (rvRadarLayer && map && map.hasLayer(rvRadarLayer)) {
                            map.removeLayer(rvRadarLayer);
                        }
                        rvRadarLayer = newRadar;
                    }
                }
            })
            .catch(function(err) {
                console.warn("RainViewer radar fetch failed:", err);
            });
    }

    window.toggleRvRadar = function() {
        var isChecked = document.getElementById('rv-radar-check').checked;
        if (isChecked) {
            if (!rvRadarLayer) {
                fetchRvRadarTiles();
            } else if (map && !map.hasLayer(rvRadarLayer)) {
                rvRadarLayer.addTo(map);
            }
        } else {
            if (rvRadarLayer && map && map.hasLayer(rvRadarLayer)) {
                map.removeLayer(rvRadarLayer);
            }
        }
    };

    window.changeRvRadarOpacity = function(val) {
        rvRadarOpacity = parseFloat(val);
        if (rvRadarLayer) {
            rvRadarLayer.setOpacity(rvRadarOpacity);
        }
    };

    window.toggleUsRadar = function() {
        var isChecked = document.getElementById('us-radar-check').checked;
        if (isChecked) {
            if (usRadarLayer && map && !map.hasLayer(usRadarLayer)) {
                usRadarLayer.addTo(map);
            }
        } else {
            if (usRadarLayer && map && map.hasLayer(usRadarLayer)) {
                map.removeLayer(usRadarLayer);
            }
        }
    };

    window.changeUsRadarOpacity = function(val) {
        usRadarOpacity = parseFloat(val);
        if (usRadarLayer) {
            usRadarLayer.setOpacity(usRadarOpacity);
        }
    };

    window.changeOpacity = function(val) {
        if (map) {
            var pane = map.getPane('heatmapPane');
            if (pane) {
                pane.style.opacity = val;
            }
        }
    };
    
    window.toggleDarkMode = function() {
        var isDark = document.getElementById('darkmap-check').checked;
        if (isDark) {
            if (map.hasLayer(lightLayer)) map.removeLayer(lightLayer);
            darkLayer.addTo(map);
        } else {
            if (map.hasLayer(darkLayer)) map.removeLayer(darkLayer);
            lightLayer.addTo(map);
        }
    };

    window.toggleFullscreen = function() {
        if (backend && typeof backend.toggleFullscreen === 'function') {
            backend.toggleFullscreen();
        } else {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(function(){});
            } else {
                document.exitFullscreen().catch(function(){});
            }
        }
    };

    window.setLastUpdate = function(timeStr) {
        var el = document.getElementById('last-update');
        if (el && timeStr) {
            if (timeStr.includes("Updating") || timeStr.includes("Standby")) {
                el.innerHTML = '<span style="color: #f1e05a; font-weight: bold;">Updating... Standby...</span>';
            } else if (timeStr === "N/A" || timeStr === "Standby...") {
                el.innerHTML = '<span style="color: #8b949e;">Standby...</span>';
            } else {
                el.innerHTML = '<span style="color: #7ee787;">Last Updated: ' + timeStr + ' UTC</span>';
            }
        }
    };

    window.updateBandCounts = function(counts_json) {
        try {
            var counts = (typeof counts_json === 'string') ? JSON.parse(counts_json) : counts_json;
            var select = document.getElementById('band-select');
            if (!select) return;
            for (var i = 0; i < select.options.length; i++) {
                var opt = select.options[i];
                var band = opt.value;
                var c = counts[band] || 0;
                if (band === "All") {
                    opt.text = "All Spots (" + c + " Parks)";
                } else {
                    opt.text = band + " (" + c + ")";
                }
            }
        } catch(e) {}
    };

    window.updateCacheStatus = function(status_json) {
        try {
            var statuses = (typeof status_json === 'string') ? JSON.parse(status_json) : status_json;
            var select = document.getElementById('band-select');
            if (!select) return;
            for (var i = 0; i < select.options.length; i++) {
                var opt = select.options[i];
                var band = opt.value;
                if (band !== "All" && band !== "Other") {
                    var isReady = statuses[band];
                    if (isReady) {
                        opt.style.color = '#7ee787';
                        opt.style.backgroundColor = '#16231a';
                    } else {
                        opt.style.color = '#f85149';
                        opt.style.backgroundColor = '#2c1215';
                    }
                }
            }
        } catch(e) {}
    };

    var lightningLayer = L.layerGroup();
    var currentLightningData = [];
    
    window.updateLightningVisibility = function() {
        lightningLayer.clearLayers();
        var checkEl = document.getElementById('lightning-check');
        if (checkEl && checkEl.checked && currentLightningData && currentLightningData.length > 0) {
            currentLightningData.forEach(function(cell) {
                var html = '';
                var hasMovement = (cell.speed !== null && cell.speed !== undefined && cell.speed > 0 && cell.heading !== null && cell.heading !== undefined);
                if (hasMovement) {
                    html = '<div style="display:flex; align-items:center; justify-content:center; width:28px; height:28px; background:rgba(255, 204, 0, 0.25); border:2px solid #ffd700; border-radius:50%; box-shadow:0 0 8px rgba(255,215,0,0.8); font-size:14px; transform: rotate(' + (cell.heading - 90) + 'deg);">⚡➤</div>';
                } else {
                    html = '<div style="display:flex; align-items:center; justify-content:center; width:26px; height:26px; background:rgba(255, 204, 0, 0.25); border:2px solid #ffd700; border-radius:50%; box-shadow:0 0 8px rgba(255,215,0,0.8); font-size:16px; color:#ffd700; text-shadow:0 0 4px #000;">⚡</div>';
                }
                var icon = L.divIcon({
                    className: 'lightning-marker',
                    html: html,
                    iconSize: [28, 28],
                    iconAnchor: [14, 14]
                });
                var marker = L.marker([cell.lat, cell.lon], {icon: icon});
                var popupContent = "<b>⚡ Lightning Cluster</b>";
                if (cell.event_type) popupContent += "<br>Type: " + cell.event_type;
                if (cell.strikes && cell.strikes > 0) popupContent += "<br>Strikes: ~" + cell.strikes;
                if (hasMovement) {
                    popupContent += "<br>Movement: " + Math.round(cell.speed) + " mph";
                    if (cell.heading !== null && cell.heading !== undefined) popupContent += " (" + Math.round(cell.heading) + "°)";
                } else {
                    popupContent += "<br>Movement: Stationary / Local";
                }
                if (cell.headline) popupContent += "<br><small style='color:#8b949e;'>" + cell.headline + "</small>";
                marker.bindPopup(popupContent);
                marker.addTo(lightningLayer);
            });
            if (map && !map.hasLayer(lightningLayer)) {
                lightningLayer.addTo(map);
            }
        } else {
            if (map && map.hasLayer(lightningLayer)) {
                map.removeLayer(lightningLayer);
            }
        }
    };

    window.updateLightning = function(cells_data) {
        try {
            currentLightningData = (typeof cells_data === 'string') ? JSON.parse(cells_data) : cells_data;
            window.updateLightningVisibility();
        } catch(e) {}
    };

    window.updateFilters = function() {
        var band = document.getElementById('band-select').value;
        var mode = document.getElementById('mode-select').value;
        var showGrayline = document.getElementById('grayline-check').checked;
        
        var physicsChanged = (band !== currentBand || mode !== currentMode);
        
        currentBand = band;
        currentMode = mode;
        renderSpots();
        
        if (physicsChanged) {
            if (heatLayer) {
                map.removeLayer(heatLayer);
                heatLayer = null;
            }
            window.setLastUpdate("Updating... Standby...");
        }
        if (backend && typeof backend.onFilterChanged === 'function') {
            backend.onFilterChanged(band, mode);
            backend.onGraylineChanged(showGrayline);
        } else {
            var params = new URLSearchParams(window.location.search);
            var token = params.get('token') || '';
            if (token) {
                fetch('/api/set_filter?band=' + encodeURIComponent(band) + '&mode=' + encodeURIComponent(mode) + '&grayline=' + showGrayline + '&token=' + encodeURIComponent(token))
                    .catch(function(err) { console.warn("Failed to set filter via HTTP:", err); });
            }
        }
    };

    window.toggleControls = function() {
        var content = document.getElementById('controls-content');
        var btn = document.getElementById('collapse-btn');
        if (content && btn) {
            if (content.style.display === 'none') {
                content.style.display = 'block';
                btn.innerHTML = '▼';
                btn.title = 'Collapse Controls';
            } else {
                content.style.display = 'none';
                btn.innerHTML = '▶';
                btn.title = 'Expand Controls';
            }
        }
    };

    window.setFilterState = function(band, mode) {
        var selectBand = document.getElementById('band-select');
        var selectMode = document.getElementById('mode-select');
        var changed = false;
        if (selectBand && band && selectBand.value !== band) {
            selectBand.value = band;
            currentBand = band;
            changed = true;
        }
        if (selectMode && mode && selectMode.value !== mode) {
            selectMode.value = mode;
            currentMode = mode;
            changed = true;
        }
        if (changed) {
            renderSpots();
        }
    };

    window.toggleGrayline = function() {
        var isChecked = document.getElementById('grayline-check') ? document.getElementById('grayline-check').checked : false;
        if (isChecked) {
            graylineLines.forEach(function(l) { if (map) l.addTo(map); });
        } else {
            graylineLines.forEach(function(l) { if (map) map.removeLayer(l); });
        }
    };

    window.updateGrayline = function(lines_data) {
        graylineLines.forEach(function(l) { if (map) map.removeLayer(l); });
        graylineLines = [];
        
        var isChecked = document.getElementById('grayline-check') ? document.getElementById('grayline-check').checked : false;
        
        var lines = (typeof lines_data === 'string') ? JSON.parse(lines_data) : lines_data;
        if (lines && lines.length > 0) {
            lines.forEach(function(lineObj) {
                if (lineObj.coords && lineObj.coords.length > 0) {
                    var offsets = [0, -360.0, 360.0, -720.0, 720.0];
                    offsets.forEach(function(offset) {
                        var isMulti = Array.isArray(lineObj.coords[0]) && Array.isArray(lineObj.coords[0][0]);
                        var shiftedCoords = [];
                        if (isMulti) {
                            shiftedCoords = lineObj.coords.map(function(segment) {
                                return segment.map(function(pt) { return [pt[0], pt[1] + offset]; });
                            });
                        } else {
                            shiftedCoords = lineObj.coords.map(function(pt) { return [pt[0], pt[1] + offset]; });
                        }
                        var l = L.polyline(shiftedCoords, lineObj.style);
                        if (isChecked && map) {
                            l.addTo(map);
                        }
                        graylineLines.push(l);
                    });
                }
            });
        }
    };

    var auroraLines = [];
    var lastAuroraStr = "";

    window.toggleAurora = function() {
        var isChecked = document.getElementById('aurora-check') ? document.getElementById('aurora-check').checked : false;
        if (isChecked) {
            auroraLines.forEach(function(l) { if (map) l.addTo(map); });
        } else {
            auroraLines.forEach(function(l) { if (map) map.removeLayer(l); });
        }
    };

    window.updateAurora = function(lines_data) {
        auroraLines.forEach(function(l) { if (map) map.removeLayer(l); });
        auroraLines = [];
        
        var isChecked = document.getElementById('aurora-check') ? document.getElementById('aurora-check').checked : false;
        
        var lines = (typeof lines_data === 'string') ? JSON.parse(lines_data) : lines_data;
        if (lines && lines.length > 0) {
            lines.forEach(function(lineObj) {
                if (lineObj.coords && lineObj.coords.length > 0) {
                    var offsets = [0, -360.0, 360.0, -720.0, 720.0];
                    offsets.forEach(function(offset) {
                        var isMulti = Array.isArray(lineObj.coords[0]) && Array.isArray(lineObj.coords[0][0]);
                        var shiftedCoords = [];
                        if (isMulti) {
                            shiftedCoords = lineObj.coords.map(function(segment) {
                                return segment.map(function(pt) { return [pt[0], pt[1] + offset]; });
                            });
                        } else {
                            shiftedCoords = lineObj.coords.map(function(pt) { return [pt[0], pt[1] + offset]; });
                        }
                        var l = L.polyline(shiftedCoords, lineObj.style);
                        if (isChecked && map) {
                            l.addTo(map);
                        }
                        auroraLines.push(l);
                    });
                }
            });
        }
    };

    function getScoreClass(score) {
        if (score >= 99) return 'score-exceptional';
        if (score >= 75) return 'score-high';
        if (score >= 50) return 'score-good';
        return 'score-poor';
    }

    function renderSpots() {
        markersLayer.clearLayers();
        
        spotsData.forEach(function(spot) {
            if (currentBand === "All" || spot.band === currentBand) {
                var modeMatches = false;
                if (!spot.mode) {
                    modeMatches = true;
                } else {
                    var m = spot.mode.toUpperCase();
                    var cm = currentMode ? currentMode.toUpperCase() : "ALL";
                    if (cm === "ALL" || cm === "ALL MODES") {
                        modeMatches = true;
                    } else if (cm === "CW" && m === "CW") {
                        modeMatches = true;
                    } else if (cm === "SSB" && (m === "SSB" || m === "USB" || m === "LSB" || m === "PHONE")) {
                        modeMatches = true;
                    } else if (cm === "FT8" && m === "FT8") {
                        modeMatches = true;
                    } else if (cm === "DATA") {
                        var standardNonOther = ["CW", "SSB", "USB", "LSB", "PHONE", "FT8", "FM", "AM"];
                        if (standardNonOther.indexOf(m) === -1) {
                            modeMatches = true;
                        }
                    } else if (m === cm) {
                        modeMatches = true;
                    }
                }
                
                if (!modeMatches) {
                    return;
                }

                var cssClass = getScoreClass(spot.score);
                var statusClass = spot.is_worked ? 'spot-marker-worked' : 'spot-marker-new';
                var iconHtml = spot.has_plus ? '<span style="color:white; font-size:11px; font-weight:bold; line-height:14px; display:block; text-align:center;">+</span>' : '';
                var icon = L.divIcon({
                    className: 'spot-marker ' + cssClass + ' ' + statusClass,
                    iconSize: [14, 14],
                    html: iconHtml
                });

                var marker = L.marker([spot.lat, spot.lon], {icon: icon});
                var scoreStr = spot.has_plus ? spot.score + "+" : spot.score;
                var statusBadge = spot.is_worked ? 
                    '<span style="color:#f85149; font-weight:bold; font-size:11px; margin-left:4px;">[WORKED]</span>' : 
                    '<span style="color:#58a6ff; font-weight:bold; font-size:11px; margin-left:4px;">[NEW]</span>';
                var qrpBadge = spot.is_qrp ? 
                    '<span style="color:#e3b341; font-weight:bold; font-size:11px; margin-left:4px;">[⚡ ' + (spot.qrp_desc || 'QRP') + ']</span>' : '';
                
                var mufStr = "";
                if (spot.muf) {
                    var mufColor = "";
                    if (spot.muf >= 28) mufColor = "#2ea043";
                    else if (spot.muf >= 18) mufColor = "#d29922";
                    else mufColor = "#da3633";
                    
                    var mufDot = '<span style="display:inline-block; width:10px; height:10px; border-radius:50%; background-color:' + mufColor + '; margin-left:4px; vertical-align:middle;"></span>';
                    mufStr = "<br>Path MUF: " + spot.muf.toFixed(1) + " MHz" + mufDot;
                }
                
                marker.bindPopup("<b>" + spot.call + "</b> " + statusBadge + qrpBadge + "<br>" + spot.park + "<br>Freq: " + (spot.freq || spot.band) + " MHz | Mode: " + (spot.mode || "Unknown") + "<br>Score: " + scoreStr + mufStr);
                markersLayer.addLayer(marker);
            }
        });
    }

    window.updateSpots = function(spots_json) {
        try {
            if (typeof spots_json === 'string') {
                spotsData = JSON.parse(spots_json);
            } else {
                spotsData = spots_json;
            }
            renderSpots();
        } catch (e) {
            console.error("Error parsing spots JSON: " + e);
        }
    };

    window.updateHeatmap = function(heatmap_json) {
        try {
            var data;
            if (typeof heatmap_json === 'string') {
                data = JSON.parse(heatmap_json);
            } else {
                data = heatmap_json;
            }
            
            if (heatLayer && map) {
                map.removeLayer(heatLayer);
            }
            
            var gridGroup = L.layerGroup();
            
            function interpolateColor(c1, c2, factor) {
                var r1 = parseInt(c1.substring(1,3), 16), g1 = parseInt(c1.substring(3,5), 16), b1 = parseInt(c1.substring(5,7), 16);
                var r2 = parseInt(c2.substring(1,3), 16), g2 = parseInt(c2.substring(3,5), 16), b2 = parseInt(c2.substring(5,7), 16);
                var r = Math.round(r1 + factor * (r2 - r1));
                var g = Math.round(g1 + factor * (g2 - g1));
                var b = Math.round(b1 + factor * (b2 - b1));
                return "#" + (1 << 24 | r << 16 | g << 8 | b).toString(16).slice(1);
            }
            
            function getGradientColor(s) {
                if (s >= 100) return '#2ea043';
                if (s >= 50) return interpolateColor('#d29922', '#2ea043', (s - 50) / 50.0);
                if (s >= 25) return interpolateColor('#f78166', '#d29922', (s - 25) / 25.0);
                return interpolateColor('#da3633', '#f78166', s / 25.0);
            }
            
            heatmapScoreLookup = {};
            if (data && data.length > 0) {
                data.forEach(function(pt) {
                    var lat = pt[0];
                    var lon = pt[1];
                    var score = Math.min(100.0, Math.max(0.0, pt[2] * 100.0));
                    heatmapScoreLookup[lat + ',' + lon] = Math.round(score);
                    
                    var color = getGradientColor(score);
                    
                    var offsets = [0, -360.0, 360.0, -720.0, 720.0];
                    offsets.forEach(function(offset) {
                        var bounds = [[lat, lon + offset], [lat + 1.0, lon + offset + 2.0]];
                        var rect = L.rectangle(bounds, {
                            pane: 'heatmapPane',
                            color: color,
                            weight: 0,
                            fillColor: color,
                            fillOpacity: 0.8
                        });
                        rect.addTo(gridGroup);
                    });
                });
            }
            
            if (map) {
                heatLayer = gridGroup.addTo(map);
            }

            var slider = document.getElementById('opacity-slider');
            if (slider) {
                window.changeOpacity(slider.value);
            }
        } catch (e) {
            console.error("Error parsing heatmap JSON: " + e);
        }
    };

    // =======================================================================================
    // DESIGN REQUIREMENT: PROPAGATION HEATMAP LIFECYCLE
    // ---------------------------------------------------------------------------------------
    // The propagation heatmap MUST be recalculated in the following scenarios:
    // 1. Initial Load: An initial propagation map MUST be created when the live map is first started.
    // 2. Filter Change: Every time the user changes the mode or band, the heatmap MUST immediately recalculate.
    // 3. 10-Minute Cycle: The heatmap MUST automatically recalculate on a strict 10-minute cycle.
    // Note: Do NOT recalculate the full propagation heatmap every time spot pins update (e.g. 15s).
    // =======================================================================================

    // =======================================================================================
    // DESIGN REQUIREMENT: UI CONTROLS & INITIALIZATION STATE
    // ---------------------------------------------------------------------------------------
    // 1. Default Selection: Upon map startup, Band MUST default to 20m and Mode MUST default to SSB (Voice).
    // 2. Unchecked by Default: All auxiliary checkboxes (Dark Map Mode, Live Weather Radar, Grayline, Lightning Clusters) MUST remain UNCHECKED and inactive on initial load.
    // 3. Basemap: The map MUST initialize with the Light basemap layer to match the unchecked Dark Map Mode state.
    // 4. Grayline Toggle: Checking/unchecking the Grayline checkbox MUST execute independently (via toggleGrayline) and MUST NOT trigger a propagation heatmap update.
    // =======================================================================================

    // Automatic polling loop for standalone browser mode (e.g. ChromeOS host browser)
    (function() {
        var params = new URLSearchParams(window.location.search);
        var token = params.get('token');
        if (token) {
            var lastSpotsStr = "";
            var lastHeatmapStr = "";
            var lastBandCountsStr = "";
            var lastGraylineStr = "";
            var lastLightningStr = "";
            var lastUpdateStr = "";

            function fetchMapData() {
                fetch('/api/map_data?token=' + encodeURIComponent(token))
                    .then(function(res) {
                        if (!res.ok) throw new Error("HTTP " + res.status);
                        return res.json();
                    })
                    .then(function(data) {
                        if (!map && data.home_lat !== undefined && data.home_lon !== undefined) {
                            initMap(data.home_lat, data.home_lon);
                        }
                        if (data.band && data.mode && !window._initialFilterSet) {
                            window._initialFilterSet = true;
                            window.setFilterState(data.band, data.mode);
                        }
                        if (data.spots !== undefined) {
                            var sStr = JSON.stringify(data.spots);
                            if (sStr !== lastSpotsStr) {
                                lastSpotsStr = sStr;
                                window.updateSpots(data.spots);
                            }
                        }
                        if (data.heatmap !== undefined) {
                            var hStr = typeof data.heatmap === 'string' ? data.heatmap : JSON.stringify(data.heatmap);
                            if (hStr !== lastHeatmapStr) {
                                lastHeatmapStr = hStr;
                                window.updateHeatmap(data.heatmap);
                            }
                        }
                        if (data.band_counts !== undefined) {
                            var bStr = JSON.stringify(data.band_counts);
                            if (bStr !== lastBandCountsStr) {
                                lastBandCountsStr = bStr;
                                window.updateBandCounts(data.band_counts);
                            }
                        }
                        if (data.grayline !== undefined) {
                            var gStr = JSON.stringify(data.grayline);
                            if (gStr !== lastGraylineStr) {
                                lastGraylineStr = gStr;
                                window.updateGrayline(data.grayline);
                            }
                        }
                        if (data.aurora !== undefined) {
                            var aStr = JSON.stringify(data.aurora);
                            if (aStr !== lastAuroraStr) {
                                lastAuroraStr = aStr;
                                window.updateAurora(data.aurora);
                            }
                        }
                        if (data.lightning !== undefined) {
                            var lStr = JSON.stringify(data.lightning);
                            if (lStr !== lastLightningStr) {
                                lastLightningStr = lStr;
                                window.updateLightning(data.lightning);
                            }
                        }
                        if (data.last_update !== undefined && data.last_update !== lastUpdateStr) {
                            lastUpdateStr = data.last_update;
                            window.setLastUpdate(data.last_update);
                        }
                    })
                    .catch(function(err) {
                        console.warn("Map data polling error:", err);
                    });
            }
            fetchMapData();
            setInterval(fetchMapData, 5000);
        }
    })();
</script>
